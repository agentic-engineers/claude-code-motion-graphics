const NS="http://www.w3.org/2000/svg", TAU=Math.PI*2;
const $=(id)=>document.getElementById(id);
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const clamp01=v=>Math.min(Math.max(v,0),1);
const backOut=(s,p)=>{const q=clamp01(p)-1;return 1+(s+1)*q*q*q+s*q*q;};
const outCubic=p=>1-Math.pow(1-clamp01(p),3);
const frac=x=>x-Math.floor(x);
const prand=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
let _maskN=0;
/* monito en coordenadas locales (asiento 1627,907). Devuelve handles. */
function makeMonito(parent, withMask){
  const g=mk("g",{opacity:0}); parent.appendChild(g);
  const bob=mk("g",{}); g.appendChild(bob);
  let mask=null, maskArms=null;
  if(withMask){
    const id="m"+(_maskN++), idA="ma"+(_maskN++);
    const defs=mk("defs",{}); g.appendChild(defs);
    defs.innerHTML='<linearGradient id="fg'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>'
      +'<mask id="'+id+'" maskUnits="userSpaceOnUse" x="1380" y="560" width="500" height="420"><rect class="fw" x="1380" y="560" width="500" height="420" fill="white"/><rect class="fgr" x="1380" y="980" width="500" height="50" fill="url(#fg'+id+')"/></mask>'
      +'<mask id="'+idA+'" maskUnits="userSpaceOnUse" x="1380" y="560" width="500" height="420"><rect class="fw" x="1380" y="560" width="500" height="420" fill="white"/><rect class="fgr" x="1380" y="980" width="500" height="50" fill="url(#fg'+id+')"/></mask>';
    mask=defs.querySelector("#"+id); maskArms=defs.querySelector("#"+idA);
  }
  const body=mk("g",{}); bob.appendChild(body);
  const arms=mk("g",{}); bob.appendChild(arms);
  if(mask){ body.setAttribute("mask","url(#"+mask.id+")"); arms.setAttribute("mask","url(#"+maskArms.id+")"); }
  const patas=[1527,1572,1660,1705].map(px=>{const r=mk("rect",{class:"f-clay",x:px,y:859,width:22,height:48});body.appendChild(r);return r;});
  body.appendChild(mk("rect",{class:"f-clay",x:1483,y:667,width:288,height:192}));
  const ojoI=mk("rect",{class:"f-ink",x:1527,y:715,width:22,height:48}), ojoD=mk("rect",{class:"f-ink",x:1705,y:715,width:22,height:48});
  body.appendChild(ojoI); body.appendChild(ojoD);
  const brI=mk("rect",{class:"f-clay",x:1439,y:763,width:44,height:48}), brD=mk("rect",{class:"f-clay",x:1771,y:763,width:44,height:48});

}
function place(m,cx,cy,sx,sy){ m.g.setAttribute("transform","translate("+cx+" "+cy+") scale("+sx.toFixed(4)+" "+(sy==null?sx:sy).toFixed(4)+") translate(-1627 -907)"); }
/* vida: pop de entrada + tecleo + bob. t0 = nacimiento. Devuelve la escala relativa (0..1). */
function alive(m,t,t0,opts){
  const o=opts||{}; const d=t-t0;
  if(d<0){ m.g.setAttribute("opacity","0"); return 0; }
  m.g.setAttribute("opacity","1");
  const s=d<0.30?backOut(1.8,d/0.30):1;
  const typing=o.typing!==false;
  const k=typing?-Math.round(6*Math.max(0,Math.sin(TAU*7*t))):0, k2=typing?-Math.round(6*Math.max(0,Math.sin(TAU*7*t+Math.PI))):0;
  m.brI.setAttribute("y",763+k); m.brD.setAttribute("y",763+k2);
  m.bob.setAttribute("transform","translate(0 "+Math.round(2*Math.sin(TAU*2*t))+")");
  return s;
}
/* disolución canónica de abajo hacia arriba, k 0..1 (brazos retrasados 0.2 del recorrido) */
function dissolve(m,k){
  const set=(mask,kk)=>{ if(!mask)return; const frontY=980-kk*400; mask.querySelector(".fw").setAttribute("height",Math.max(0,frontY-560).toFixed(1)); mask.querySelector(".fgr").setAttribute("y",(frontY-50).toFixed(1)); };
  set(m.mask,clamp01(k)); set(m.maskArms,clamp01((k-0.2)/0.8));

/* partículas de disolución en coordenadas locales: nacen por filas, de abajo hacia arriba */
function seedDissolveParts(m,t0,t1,seed){
  for(let n=0;n<44;n++){
    const ox=1483+prand(seed+n*13)*288, oy=667+prand(seed+n*7+1)*192;
    const birth=t0+(1-(oy-667)/192)*(t1-t0);
    const sz=4+prand(seed+n*19)*4;
    const el=mk("rect",{width:sz.toFixed(1),height:sz.toFixed(1),opacity:0,class:n%2?"f-clay":"f-clay-deep"});
    m.parts.appendChild(el);
    m.P.push({el,ox,oy,b:birth,life:0.28+prand(seed+n*11)*0.14,vx:(prand(seed+n*5)-0.5)*90,vy:-(50+prand(seed+n*3)*70)});
  }
}
/* puf de colapso: 10 partículas radiales desde el centro del cuerpo */
function seedPuff(m,tb,seed){
  for(let n=0;n<10;n++){
    const ang=(n/10)*TAU; const el=mk("rect",{width:5,height:5,opacity:0,class:n%2?"f-clay":"f-clay-deep"}); m.parts.appendChild(el);
    m.P.push({el,ox:1627,oy:763,b:tb,life:0.22+prand(seed+n)*0.1,vx:Math.cos(ang)*(90+prand(seed+n+3)*50),vy:Math.sin(ang)*(70+prand(seed+n+5)*40)-30});
  }
}
function renderParts(P,t,G){
  G=G==null?-25:G;
  for(const q of P){ const raw=t-q.b, ti=Math.min(Math.max(raw,0),q.life), on=raw>0&&raw<q.life;
    q.el.setAttribute("x",(q.ox+q.vx*ti).toFixed(2)); q.el.setAttribute("y",(q.oy+q.vy*ti+0.5*G*ti*ti).toFixed(2));

/* rótulo pixel que nace con pop desde su centro y colapsa */
function label(parent,text,x,y,cell,cls){
  const g=mk("g",{opacity:0}); parent.appendChild(g);
  const w=buildPixelText(g,text,{x,y,cell,cls:cls||"f-ink"});
  return {g,cx:x+w/2,cy:y+3.5*cell,w};
}
function labelPose(L,t,t0,t1){
  if(t<t0){L.g.setAttribute("opacity","0");return;}
  let s=t-t0<0.3?backOut(1.6,(t-t0)/0.3):1;
  if(t1!=null && t>=t1){ const k=clamp01((t-t1)/0.10); s=1-k*k; if(k>=1){L.g.setAttribute("opacity","0");return;} }
  L.g.setAttribute("opacity","1");
  L.g.setAttribute("transform","translate("+L.cx+" "+L.cy+") scale("+s.toFixed(4)+") translate("+(-L.cx)+" "+(-L.cy)+")");
}
/* bloque de palabras, cada una con su tiempo; layout por líneas dentro de maxW */
function wordsBlock(parent,words,x,y,cell,maxW){
  const out=[]; let cx=x, cy=y; const gap=1.4*cell, lh=7*cell+14;
  for(const wd of words){ const w=pixelTextWidth(wd.w,cell); if(cx>x && cx+w>x+maxW){cx=x;cy+=lh;}
    const L=label(parent,wd.w,cx,cy,cell,wd.cls); L.t=wd.t; out.push(L); cx+=w+gap; }
  return out;
}
/* tarjeta: texto pixel sobre paper; entra con pop desde la izquierda, colapsa */
function card(parent,text,x,y,cell,cls,pad){
  pad=pad==null?16:pad; const g=mk("g",{opacity:0}); parent.appendChild(g);
  const w=pixelTextWidth(text,cell), h=7*cell;
  g.appendChild(mk("rect",{class:"f-paper",x:x-pad,y:y-pad,width:w+2*pad,height:h+2*pad,rx:18}));
  buildPixelText(g,text,{x,y,cell,cls:cls||"f-ink"});

}
function cardPose(c,t,t0,t1){
  if(t<t0){c.g.setAttribute("opacity","0");return;}
  let s=t-t0<0.3?backOut(1.5,(t-t0)/0.3):1, sy=1;
  if(t1!=null && t>=t1){ const k=clamp01((t-t1)/0.10); s=1-k*k; sy=s; if(k>=1){c.g.setAttribute("opacity","0");return;} }
  c.g.setAttribute("opacity","1");

/* bloque de palabras con tiempo, dentro de un paper que se ajusta al bloque */
function wordsPanel(parent,words,x,y,cell,maxW){
  const pad=22, gap=6*cell, lh=7*cell+16; const out=[]; let cx=x, cy=y, maxX=x;
  const holder=mk("g",{}); parent.appendChild(holder);
  for(const wd of words){ const w=pixelTextWidth(wd.w,cell); if(cx>x && cx+w>x+maxW){cx=x;cy+=lh;}
    const L=label(holder,wd.w,cx,cy,cell,wd.cls); L.t=wd.t; out.push(L); cx+=w+gap; maxX=Math.max(maxX,cx-gap); }

/* panel paper de fondo (nace con pop) */
function paper(parent,x,y,w,h,rx){ const g=mk("g",{opacity:0}); parent.appendChild(g); g.appendChild(mk("rect",{class:"f-paper",x,y,width:w,height:h,rx:rx||30})); return {g,cx:x+w/2,cy:y+h/2}; }

/* LIB2: actuación del monito sobre la mesa. Se inlinea después de LIB (gen.py). */
const pop=(t,t0,d,o)=>{d=d||0.3;o=o==null?1.6:o;if(t<t0)return 0;return t-t0<d?backOut(o,(t-t0)/d):1;};
const fade=(t,t1,d)=>{d=d||0.10;if(t1==null||t<t1)return 1;const k=clamp01((t-t1)/d);return 1-k*k;};
const lerp=(a,b,k)=>a+(b-a)*k;
const smooth=k=>{k=clamp01(k);return k*k*(3-2*k);};
const ease=(t,t0,t1)=>smooth((t-t0)/(t1-t0));
function xf(el,cx,cy,sx,sy,rot){ el.setAttribute("transform","translate("+cx.toFixed(2)+" "+cy.toFixed(2)+") rotate("+(rot||0).toFixed(2)+") scale("+sx.toFixed(4)+" "+(sy==null?sx:sy).toFixed(4)+") translate("+(-cx).toFixed(2)+" "+(-cy).toFixed(2)+")"); }
function show(el,on){ el.setAttribute("opacity",on?"1":"0"); }
/* pop + muerte de un grupo alrededor de (cx,cy); devuelve la escala aplicada */
function popDie(el,t,t0,t1,cx,cy,o){ o=o||{}; const s=pop(t,t0,o.d,o.o)*fade(t,t1,o.fd); show(el,s>0); if(s>0) xf(el,cx,cy,s*(o.sx||1),s*(o.sy||1),o.rot||0); return s; }
/* monito con rotación alrededor de los pies */
function placeEx(m,cx,cy,sx,sy,rot){ m.g.setAttribute("transform","translate("+cx.toFixed(2)+" "+cy.toFixed(2)+") rotate("+(rot||0).toFixed(2)+") scale("+sx.toFixed(4)+" "+(sy==null?sx:sy).toFixed(4)+") translate(-1627 -907)"); }
/* sombra de contacto */
function shadow(parent){ const e=mk("ellipse",{fill:"#000",opacity:0}); parent.appendChild(e); return e; }
function shadowPose(sh,cx,cy,s,air,on){ if(!on){sh.setAttribute("opacity","0");return;} const k=clamp01(1-air/140); sh.setAttribute("cx",cx.toFixed(1)); sh.setAttribute("cy",(cy+3).toFixed(1)); sh.setAttribute("rx",(150*s*(0.7+0.3*k)).toFixed(1)); sh.setAttribute("ry",(14*s*(0.6+0.4*k)).toFixed(1)); sh.setAttribute("opacity",(0.24*k).toFixed(3)); }
function eyes(m,mode){ const h=mode==="closed"?6:mode==="squint"?22:48, y=mode==="closed"?736:mode==="squint"?728:715; for(const e of [m.ojoI,m.ojoD]){e.setAttribute("height",h);e.setAttribute("y",y);} }

function grey(m){ for(const r of [...m.patas,m.body.childNodes[4],m.brI,m.brD]) if(r&&r.setAttribute) r.setAttribute("class","f-gris"); }
/* pista de movimiento: segmentos {type:'hop'|'jump'|'at', t0,t1, from,to | at, s:[s0,s1]|s, h, n} */
function motion(segs,t,def){
  const st={x:def.x,y:def.y,s:def.s,air:0,sx:1,sy:1,moving:false};
